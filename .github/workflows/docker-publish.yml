name: Publish Docker Image to Docker Hub

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Permite ejecutar el workflow manualmente desde GitHub

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Reemplaza 'estudiojuridicoweb' por el nombre que prefieras para tu repositorio en Docker Hub
          tags: ${{ secrets.DOCKER_USERNAME }}/estudiojuridico:v1
